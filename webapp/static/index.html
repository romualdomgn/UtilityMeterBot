<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Учёт счётчиков</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <div class="topbar-row">
        <div class="topbar-title-wrap">
          <h1 id="app-title">Счётчики</h1>
          <button id="edit-profile-btn" class="user-badge-btn" type="button" title="Изменить имя" disabled>
            <span id="user-badge" class="muted small">Загрузка...</span>
            <span id="edit-profile-ico" class="edit-ico hidden">✏️</span>
          </button>
        </div>
        <select id="apt-selector" class="apt-select hidden"></select>
      </div>
    </header>

    <main id="content" class="content">
      <div class="card center muted loading-card">
        <span class="spinner"></span>
        <span>Подключение к серверу...</span>
      </div>
    </main>

    <nav id="bottom-nav" class="bottom-nav hidden"></nav>
  </div>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="modal-title"></h3>
      <div id="modal-body"></div>
      <div id="modal-actions" class="row-gap mt-12"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
